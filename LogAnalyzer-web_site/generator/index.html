
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор команд — LogAnalyzer</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="generator.css">
</head>
<body>
<div class="container">
    <nav id="nav-placeholder"></nav>

    <h1>Генератор командной строки</h1>
    <p>Заполните поля и нажмите кнопку, чтобы скопировать готовую команду запуска LogAnalyzer.</p>

    <div class="generator">
        <div class="form-group">
            <label>Путь к логам (-p, --path)</label>
            <input type="text" id="inputPath" placeholder="C:\Logs\app.log или папка" style="width:100%; padding: 8px; border-radius: 8px; border: 1px solid #ccc;">
        </div>

        <div class="form-group">
            <label>Ключевые слова (-k, --keywords)</label>
            <input type="text" id="keywordsInput" placeholder="ERROR,Exception,Timeout" style="width:100%; padding: 8px; border-radius: 8px; border: 1px solid #ccc;">
        </div>

        <div class="form-group">
            <label>Файл конфигурации (-c, --config)</label>
            <input type="text" id="configPath" placeholder="my_config.json" style="width:100%; padding: 8px; border-radius: 8px; border: 1px solid #ccc;">
        </div>

        <div class="form-group">
            <label>Путь для сохранения отчёта (-o, --output)</label>
            <input type="text" id="outputPath" placeholder="C:\Reports\result.txt" style="width:100%; padding: 8px; border-radius: 8px; border: 1px solid #ccc;">
        </div>

        <div class="form-group">
            <label>Формат отчёта (-f, --format)</label>
            <select id="format" style="padding: 8px; border-radius: 8px; width:100%;">
                <option value="txt">TXT (по умолчанию)</option>
                <option value="json">JSON</option>
                <option value="xml">XML</option>
                <option value="wordgroup">WordGroup</option>
            </select>
        </div>

        <div class="form-group">
            <label>Флаги</label>
            <div class="flag-group">
                <label><input type="checkbox" class="flag" value="-a" id="flagAllLines"> Выводить каждую найденную строку (-a)</label>
                <label><input type="checkbox" class="flag" value="-r" id="flagFinalReport"> Итоговый отчёт в консоль (-r)</label>
                <label><input type="checkbox" class="flag" value="-s false" id="flagShowConsole"> Отключить вывод в консоль (-s false)</label>
                <label><input type="checkbox" class="flag" value="-d" id="flagDisableLogging"> Отключить логирование (-d)</label>
            </div>
        </div>

        <div class="form-group">
            <button class="btn" id="generate-cli">📋 Сгенерировать и скопировать CLI</button>
            <span id="cli-feedback" class="copy-feedback">✅ Команда скопирована</span>
        </div>

        <div class="output-area">
            <textarea id="commandOutput" rows="3" readonly placeholder="Здесь появится команда..."></textarea>
        </div>
    </div>

    <div id="footer-placeholder"></div>
</div>
<script src="../loadTopBottom.js"></script>
<script src="generator.js"></script>
</body>
</html>
